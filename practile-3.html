<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <!-- Иконка страницы (логотип) -->
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Подключение внешнего CSS-файла -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Блок меню для кнопок -->
    <div id="menu-container">
        <h1>Добро пожаловать!</h1>

        <!-- Первая форма с кнопкой -->
        <form id="form1" action="https://www.google.com" target="_blank">
            <button class="my-button">
                <p class="button-text">Поиск в Google</p>
            </button>
        </form>

        <!-- Вторая форма с кнопкой -->
        <form id="form2" action="https://www.wikipedia.org" target="_blank">
            <button class="my-button">
                <p class="button-text">Википедия</p>
            </button>
        </form>

        <!-- Третья форма с кнопкой -->
        <form id="form3" action="https://www.youtube.com" target="_blank">
            <button class="my-button">
                <p class="button-text">YouTube</p>
            </button>
        </form>
    </div>

</body>
</html>
